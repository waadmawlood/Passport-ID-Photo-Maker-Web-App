<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" /> <!-- Blue-600 -->
      <stop offset="100%" stop-color="#7c3aed" /> <!-- Violet-600 -->
    </linearGradient>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />
  
  <!-- Passport/ID Frame -->
  <rect x="20" y="15" width="60" height="70" rx="6" fill="rgba(255, 255, 255, 0.15)" stroke="white" stroke-width="3" />
  <rect x="26" y="21" width="48" height="48" rx="4" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2" stroke-dasharray="4 4" />
  
  <!-- Person Silhouette -->
  <circle cx="50" cy="40" r="12" fill="white" />
  <path d="M 30 75 C 30 60, 38 55, 50 55 C 62 55, 70 60, 70 75 Z" fill="white" />
  
  <!-- ID Card Text Lines -->
  <rect x="30" y="80" width="20" height="3" rx="1.5" fill="white" opacity="0.8" />
  <rect x="55" y="80" width="15" height="3" rx="1.5" fill="white" opacity="0.8" />
  
  <!-- Decorative Sparkles / Stars -->
  <path d="M 12 50 L 14 44 L 20 42 L 14 40 L 12 34 L 10 40 L 4 42 L 10 44 Z" fill="#93c5fd" opacity="0.8" />
  <path d="M 85 25 L 86.5 20 L 91.5 18.5 L 86.5 17 L 85 12 L 83.5 17 L 78.5 18.5 L 83.5 20 Z" fill="#c4b5fd" opacity="0.8" />
</svg>